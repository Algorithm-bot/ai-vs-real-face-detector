model:
  backbone: efficientnet_b0
  freeze_blocks: 5
  checkpoint_path: models/hybrid_best.pt
  stage1_checkpoint_path: models/stage1_best.pt
  version: "0.2.0"

inference:
  confidence_threshold: 0.55
  uncertainty_threshold: 0.35
  margin_threshold: 0.15
  temperature: 1.0
  align_face: false
  default_label_on_low_confidence: real

physics:
  highlight_iou_threshold: 0.35
  light_angle_threshold_deg: 25.0
  light_cosine_threshold: 0.85

database:
  url: postgresql://postgres:postgres@db:5432/face_detector
  echo: false

api:
  host: 0.0.0.0
  port: 8000
  max_upload_size_mb: 10
  cors_origins:
    - "*"

logging:
  level: INFO
  log_file: logs/app.log
  log_predictions: true

alerts:
  enabled: false
  min_confidence_for_alert: 0.9
  alert_on_label: ai
